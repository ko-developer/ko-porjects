<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141821">
<title>KO Studio — תכנון הסאונד שלך</title>
<style>
*{box-sizing:border-box}
:root{--ink:#141821;--muted:#7b7568;--line:#e7e2d8;--bg:#faf8f4;--go:#0f6e56;--accent:#ff6a3d;--violet:#7c5cff}
body{margin:0;font-family:-apple-system,'Segoe UI','Rubik',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#141821,#2b3244);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-weight:900;font-size:17px}
header h1{font-size:17px;margin:0;font-weight:800}header p{margin:0;font-size:11.5px;opacity:.75}
#steps{display:flex;gap:4px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:66px;z-index:19}
.st{flex:1;min-width:66px;text-align:center;font-size:11.5px;padding:7px 4px;border-radius:9px;color:var(--muted);white-space:nowrap;cursor:pointer}
.st.on{background:var(--ink);color:#fff;font-weight:800}.st.done{color:var(--go);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px 16px 120px}
h2{font-size:24px;margin:6px 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:#c8c1b4;transform:translateY(-2px)}
.card.sel{border-color:var(--go);background:#f0f9f5;box-shadow:0 6px 20px rgba(15,110,86,.13)}
.card .ic{font-size:34px;line-height:1;margin-bottom:8px}
.card b{display:block;font-size:15px;margin-bottom:3px}.card small{color:var(--muted);font-size:11.5px;line-height:1.45;display:block}
.card .pill{position:absolute;top:8px;left:8px;background:#f0ede8;border-radius:20px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.opt.sel{border-color:var(--go);background:#f0f9f5}.opt .ic{font-size:38px}.opt b{display:block;font-size:16px;margin:6px 0 3px}
.opt small{color:var(--muted);font-size:12px;display:block;margin-bottom:12px}
.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
input:focus{outline:none;border-color:var(--go)}
.row{display:flex;gap:10px}.row .fld{flex:1}
button{font-family:inherit;cursor:pointer;border:none}
.go{background:var(--go);color:#fff;font-weight:800;font-size:16px;padding:14px 26px;border-radius:14px}
.go[disabled]{opacity:.35;cursor:not-allowed}.go.sm{font-size:14px;padding:10px 18px}
.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;padding:12px 22px;border-radius:14px}
.ghost.sm{padding:5px 10px;font-size:13px}.wide{width:100%;margin-top:8px}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;z-index:30;max-width:1180px;margin:0 auto}
.note{background:#fff;border:1px solid var(--line);border-right:5px solid var(--violet);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.65;margin:14px 0}
.note.ok{border-right-color:var(--go);background:#f0f9f5}
.planbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;margin:14px 0;overflow:hidden;display:flex;justify-content:center;position:relative}
.planwrap{position:relative;line-height:0;width:max-content;max-width:100%}
.planwrap img{display:block;border-radius:10px;width:auto;max-width:100%;max-height:var(--planh,max(320px,calc(100vh - 300px)))}
/* בדוח התכנית מוצגת במלוא הרוחב — שם רוצים כמה שיותר גדול */
.planbox.report{padding:6px;margin:10px 0}
.planbox.report .planwrap{width:100%}
.planbox.report .planwrap img{max-height:none;width:100%}
/* שולחן עבודה — התכנית נעוצה, ההסברים לצידה (בלי גלילה הלוך ושוב) */
.wb{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,.75fr);gap:16px;align-items:start}
.wbplan{min-width:0}
.wb .wbplan{position:sticky;top:112px}
.wb .planbox{margin:0 0 10px}
.wb .rulerbox{margin:0}
.wb .wbside{min-width:0}
.wb .wbside>*:first-child{margin-top:0}
@media(max-width:900px){
  .wb{grid-template-columns:1fr;--planh:32vh}
  .wb .wbplan{position:sticky;top:104px;z-index:6}
  .wb .planbox{box-shadow:0 6px 18px rgba(0,0,0,.07)}
  .wb .rulerbox{display:none}
  /* בנייד חוסכים גובה בכותרות כדי שהתכנית והכפתורים יהיו יחד על המסך */
  main{padding-top:10px}
  h2{font-size:19px;margin:2px 0 2px}
  .sub{font-size:12.5px;line-height:1.45;margin:0 0 10px}
  .wb .cards{grid-template-columns:1fr 1fr}
}
.planwrap svg{position:absolute;inset:0;width:100%;height:100%}
.calib{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#fff;border:2px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.zlist{display:flex;flex-direction:column;gap:12px}
.zcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.zhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}.zhead input{font-weight:800;font-size:16px;border-color:transparent;background:#faf8f4}
.zinfo{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0}
.budget{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.bignum{font-size:40px;font-weight:900;letter-spacing:-1px;color:var(--go)}
.budget input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--go)}
.brange{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.fit{display:flex;flex-direction:column;gap:8px}
.fitrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px}
.fitrow b{min-width:64px}.fitrow span{color:var(--muted)}.fitrow .amt{margin-right:auto;font-weight:800;color:var(--ink);font-size:15px}
.fitrow.ok{border-right:5px solid var(--go)}.fitrow.over{border-right:5px solid #d9534f;opacity:.75}
.fitrow .badge{font-size:11px;font-weight:700}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.offer{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;position:relative;display:flex;flex-direction:column}
.offer.reco{border-color:var(--violet);box-shadow:0 10px 34px rgba(124,92,255,.16)}
.offer.sel{border-color:var(--go);background:#f7fdfa}
.ribbon{position:absolute;top:-11px;right:18px;background:var(--violet);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px}
.oh b{font-size:20px;display:block}.oh small{color:var(--muted);font-size:12px}
.price{font-size:27px;font-weight:900;margin:10px 0 4px;letter-spacing:-.5px}
.price small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.why{font-size:13px;color:#4a4640;line-height:1.6;margin:8px 0 12px}
.specs{display:flex;gap:8px;margin-bottom:12px}
.specs div{flex:1;background:#faf8f4;border-radius:11px;padding:9px 4px;text-align:center}
.specs b{display:block;font-size:19px}.specs small{font-size:10.5px;color:var(--muted)}
.prods{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.prod{display:flex;gap:9px;align-items:center;background:#faf8f4;border-radius:11px;padding:7px}
.prod img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px}
.prod .noimg{width:40px;height:40px;display:grid;place-items:center;background:#fff;border-radius:8px;font-size:19px}
.prod b{font-size:12.5px;display:block;line-height:1.3}.prod small{font-size:11px;color:var(--muted)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;margin-top:auto}
.b{font-size:11px;background:#f0ede8;border-radius:20px;padding:3px 9px;font-weight:600;color:var(--muted)}
.b.ok{background:#e6f5ee;color:var(--go)}.b.over{background:#fdeaea;color:#c1121f}
#report{background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:18px}
.rhead h1{font-size:25px;margin:0}.rhead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.rlogo{width:46px;height:46px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}
.rsec{margin-bottom:24px}.rsec h3{font-size:17px;margin:0 0 10px;background:#faf8f4;padding:8px 12px;border-radius:10px}
.rsec h4{font-size:13.5px;margin:14px 0 5px;color:var(--muted)}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{background:#faf8f4;text-align:right;padding:8px;font-size:12px;color:var(--muted)}
.rt td{padding:8px;border-bottom:1px solid #f0ede8;text-align:right}
.rt .sku{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
.rt .good{color:var(--go);font-weight:800}.rt .warn{color:#c98a1b;font-weight:800}
.rt.sum{margin-top:12px}.rt.sum td:last-child{text-align:left;font-weight:700}
.rt.sum .tot td{border-top:2px solid var(--ink);font-size:17px;font-weight:900;padding-top:10px}
.legend{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.lg{width:34px;height:11px;border-radius:3px;display:inline-block}
.lg.cold{background:linear-gradient(90deg,#3c82eb,#78c8eb)}.lg.warm{background:linear-gradient(90deg,#f0dc5a,#f06a2a)}
.lgnote{margin-right:auto}
.todo{margin:0;padding-right:20px;font-size:13.5px;line-height:2}
.ract{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.calmodes{display:flex;gap:8px;margin:8px 0 12px}.calmodes .chip{flex:1;text-align:center;padding:11px 8px}
.rulerbox{background:#faf8f4;border-radius:12px;padding:12px;margin:10px 0}
.rulerlbl{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.ruler{height:14px;background:linear-gradient(90deg,var(--accent),#ffb08a);border-radius:7px;position:relative;margin-bottom:10px;min-width:26px}
.ruler span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff}
.ruler.small{background:#c8c1b4;height:10px;margin-bottom:0}
.content-q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.content-q b{display:block;margin-bottom:8px;font-size:15px}
.content-q small{color:var(--muted);font-size:12px;line-height:1.5;display:block;margin-top:6px}
.znum{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.hintline{color:var(--muted);font-size:11.5px;display:block;margin-top:6px}
.wsec{background:#faf8f4;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.wsec h5{margin:0 0 6px;font-size:13.5px}
.wsec p,.wsec li{font-size:12.5px;line-height:1.7;color:#4a4640;margin:0}
.editable{font-size:11px;font-weight:700;color:var(--violet);background:#f0edff;border-radius:20px;padding:2px 9px;margin-right:6px}
.wt input{padding:5px 7px;font-size:12px;border-width:1px;border-radius:7px;min-width:70px}
.wt td{padding:4px}.lencell{white-space:nowrap}.lencell input{width:62px}
.lencell small{display:block;font-size:9.5px;color:var(--muted)}
.wact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ampline{background:#faf8f4;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#4a4640;margin-bottom:10px}
#resetBtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
#resetBtn:hover{background:rgba(255,255,255,.22)}
.askov{position:fixed;inset:0;background:rgba(20,24,32,.55);z-index:80;display:grid;place-items:center;padding:20px}
.askbox{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.35)}
.askbox p{margin:0 0 16px;font-size:14.5px;line-height:1.65}
.askbtns{display:flex;gap:8px}.askbtns button{flex:1}
.go.danger{background:#c1121f}
.guide{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.gstep{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.gstep b{width:26px;height:26px;border-radius:50%;background:#f0ede8;color:var(--muted);display:grid;place-items:center;font-size:13px;flex:none}
.gstep.now{border-color:var(--violet);background:#f6f4ff;color:var(--ink);font-weight:600}
.gstep.now b{background:var(--violet);color:#fff}
.gstep.done{opacity:.55}.gstep.done b{background:var(--go);color:#fff}
.opt.hero{border-color:var(--go);background:#f0f9f5}
.okcard{display:flex;gap:10px;margin:10px 0}
.okcard div{flex:1;background:#eef7f1;border:2px solid var(--go);border-radius:14px;padding:12px;text-align:center}
.okcard b{display:block;font-size:22px;color:var(--go)}.okcard small{font-size:11px;color:var(--muted)}
.fallback{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
.fallback summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.calpop{background:#fff;border:2px solid var(--violet);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);width:240px;position:relative}
.calpop b{display:block;font-size:13px;margin-bottom:7px}
.calrow{display:flex;gap:6px}.calrow input{flex:1;padding:9px;font-size:15px}
.calpop small{display:block;font-size:10.5px;color:var(--muted);margin-top:6px}
.calx{position:absolute;top:6px;left:8px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer}
.emptyzone{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:24px 18px;text-align:center;margin-top:12px}
.emptyzone .ic{font-size:40px}.emptyzone b{display:block;font-size:17px;margin:8px 0 4px}
.emptyzone small{color:var(--muted);font-size:12.5px;display:block;margin-bottom:14px}
.sugg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sugg b{font-size:12.5px;margin-bottom:6px}.sugg small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.sugg .chips{justify-content:center}
.zsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:6px 0 8px}
.ztag{border-radius:20px;padding:3px 10px;font-weight:700;font-size:12px}
.shapehelp{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.shapehelp b{color:var(--ink)}
/* בתוך שולחן העבודה הכרטיסים קומפקטיים — כל האפשרויות נראות בלי גלילה */
.wb .cards{grid-template-columns:1fr 1fr;gap:8px}
.wb .card{padding:10px 8px}
.wb .card .ic{font-size:24px;margin-bottom:2px}
.wb .card b{font-size:13.5px}
.wb .card small{font-size:11px;line-height:1.35}
.wb .two{grid-template-columns:1fr}
.navhint{position:absolute;top:-30px;right:16px;left:16px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:rgba(20,20,20,.82);border-radius:999px;padding:5px 10px}
.planops{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:12px 0;display:flex;flex-direction:column;gap:7px}
.planops>b{font-size:12px;color:var(--muted);font-weight:700}
.planops .ghost{width:100%;font-size:13px;padding:9px 10px}
.srcgrid{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.srcrow{display:flex;align-items:center;gap:8px;background:#faf8f4;border-radius:10px;padding:6px 8px;font-size:12.5px}
.srcrow>b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .chips{margin:0;flex-wrap:nowrap}
.znum.sm{width:20px;height:20px;font-size:11px;flex:none}
.chip.xs{padding:4px 9px;font-size:11.5px}
.chip.ghosty{border-style:dashed;color:var(--muted)}
.srcsum{display:block;margin-top:6px}
.planops .ghost.on{border-color:var(--accent);color:var(--accent);background:#fff5f0}
.fitcard{background:#fff;border:2px solid var(--go);border-radius:16px;padding:14px;margin:12px 0}
.fitcard.floor{border-color:#c1121f;background:#fff7f6}
.fchead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.fchead .amt{font-size:20px;font-weight:900;color:var(--go)}
.fitcard.floor .fchead .amt{color:#c1121f}
.fitcard p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 8px}
.cutlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cutlist span{background:#f4f1ec;border-radius:999px;padding:4px 10px;font-size:12px}
.offer.fitoffer{border-color:var(--go)}
.ribbon.fitrib{background:var(--go)}
.mountrow{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:12px;color:var(--muted)}
.mountrow .chip{margin:0}
#proLink{background:linear-gradient(135deg,#ff6a3d,#ff9f6e);color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
#proLink:hover{filter:brightness(1.07)}
@media(max-width:520px){#proLink{padding:7px 10px;font-size:11.5px}}
.fitcard2{background:#fff;border:1px solid var(--line);border-right:6px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fitcard2.ok{border-right-color:var(--go)}
.fitcard2.over{border-right-color:#e07a5f}
.f2head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.f2head b{font-size:16px}
.f2head .brand{color:var(--muted);font-size:12.5px}
.f2amt{text-align:left;font-size:19px;font-weight:900;color:var(--ink);white-space:nowrap}
.f2amt small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.fitcard2.ok .f2amt small{color:var(--go)}
.fitcard2.over .f2amt small{color:#c1121f}
.f2body{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}
@media(max-width:640px){.f2body{grid-template-columns:1fr}}
.f2body ul{list-style:none;margin:0;padding:0;font-size:12.5px}
.f2body li{display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.f2body li span{margin-right:auto;color:var(--muted);white-space:nowrap}
.f2side li{color:var(--muted)}
.f2sum{font-weight:900;color:var(--ink)!important;border-bottom:none!important}
.f2sum span{color:var(--ink)!important}
.f2foot{margin-top:8px;font-size:12px;color:var(--muted)}
.incl{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#faf8f4;padding:8px 10px}
.incl summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink)}
.inclt{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px}
.inclt th{text-align:right;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:4px 3px}
.inclt td{padding:4px 3px;border-bottom:1px dashed var(--line)}
.inclt tr.sub2 td{font-weight:900;border-bottom:none}
.instin{width:64px;padding:3px 5px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:11.5px;text-align:center}
.scale{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.scale .sb{color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.scale b{font-size:11px;color:var(--muted);margin-right:4px}
.forgot{background:#fff;border:1px solid var(--line);border-right:5px solid var(--violet);border-radius:14px;padding:12px;margin:10px 0}
.forgot>b{font-size:13px;color:var(--ink);display:block;margin-bottom:8px}
.fgrid{display:flex;flex-direction:column;gap:6px}
.fbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:right;background:#faf8f4;border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.fbtn:hover{border-color:var(--violet);background:#f6f4ff}
.fbtn .fic{font-size:20px;flex:none}
.fbtn b{display:block;font-size:13px}
.fbtn small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.fbtn .fdb{margin-right:auto;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.fnote{display:block;margin-top:7px;font-size:11px;color:var(--muted)}
.finish{background:#fff;border:1px solid var(--line);border-right:5px solid var(--violet);border-radius:14px;padding:13px 14px;margin:12px 0}
.finish>b{display:block;font-size:14px;margin-bottom:3px}
.finish>small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fchips .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 13px;line-height:1.25}
.fchips .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:block}
.fchips .fd{font-size:10.5px;font-weight:700;color:var(--muted)}
.fchips .chip.on .fd{color:#fff;opacity:.85}
.fchips .fd.up{color:var(--accent)}
.fchips .fd.down{color:var(--go)}
.fnote{display:block;margin-top:8px;font-size:11.5px;color:var(--muted)}
.finline{background:#f6f4ff;border-radius:9px;padding:6px 9px;margin:8px 0;font-size:12px;color:var(--violet);font-weight:700}
.inclt tr.ed td{background:#f6f4ff}
.edtag{font-size:10px;color:var(--violet);font-weight:800}
.rowops{white-space:nowrap}
.rowops button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 6px;cursor:pointer;font-size:11px;margin-inline-start:3px}
.rowops button:hover{border-color:var(--violet)}
tr.learn td{background:#fffbea;font-size:11.5px;color:#7a5c00}
tr.learn .ghost.sm{padding:2px 9px;font-size:11px;margin-inline-start:6px}
.oebox{background:#fff;border:1px solid var(--violet);border-radius:11px;padding:9px;margin:7px 0;display:flex;flex-direction:column;gap:5px}
.oebox input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px}
.oehit{display:flex;justify-content:space-between;gap:8px;text-align:right;border:1px solid var(--line);background:#faf8f4;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:12px}
.oehit:hover{border-color:var(--violet);background:#f6f4ff}
.oehit span{color:var(--muted);font-size:11px;white-space:nowrap}
.ract .pro{background:linear-gradient(135deg,#ff6a3d,#ff9f6e);color:#fff;border:none;font-weight:800}
.ract .pro:hover{filter:brightness(1.07)}
.zctl{position:absolute;top:10px;left:10px;z-index:8;display:flex;flex-direction:column;gap:5px}
.zctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fffffff2;
  font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);line-height:1}
.zctl button:hover{border-color:var(--go);color:var(--go)}
.zctl button:last-child{font-size:14px;display:none}
.zctl.zoomed button:last-child{display:block}
@media print{.zctl{display:none!important}}
.aicard{background:linear-gradient(135deg,#f6f4ff,#eef2ff);border:1px solid #d6d0f5;border-right:5px solid var(--violet);
  border-radius:14px;padding:13px 14px;margin-bottom:12px}
.aicard>b{display:block;font-size:14px;color:var(--violet);margin-bottom:4px}
.aicard>small{display:block;color:var(--muted);font-size:12px;line-height:1.55;margin-bottom:10px}
.aibtn{width:100%;background:linear-gradient(135deg,#7c5cff,#a78bfa);color:#fff;border:none;border-radius:12px;
  padding:11px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(124,92,255,.3)}
.aibtn:hover{filter:brightness(1.06)}
.aibtn[disabled]{opacity:.6;cursor:wait}
.askin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;
  margin-bottom:14px;direction:ltr;text-align:left}
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
@media print{header,#steps,#nav,.ract,#toasts,.navhint{display:none!important}.wb{display:block}.wb .wbplan{position:static}main{padding:0;max-width:none}#report{border:none;padding:0}}
</style>

# פריסה אוטומטית ל-Cloud Run בכל push ל-main: בנייה בענן (Cloud Build) מהקוד ופריסה.
# אימות בלי מפתחות: Workload Identity Federation (pool "github", provider "github-oidc") —
# רק הריפו ko-developer/ko-porjects יכול להתחזות ל-ko-projects-deployer.
name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-ko-projects
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate app (syntax + data)
        run: npm ci --no-audit --no-fund && npm run validate
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/226076433415/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ko-projects-deployer@scripts-298706.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          CI: "1"
        run: bash scripts/deploy-gcp.sh deploy
